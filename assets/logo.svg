<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="420"
     height="420"
     viewBox="0 0 420 420"
     role="img"
     aria-labelledby="title description">
  <title id="title">Visum symbol</title>
  <desc id="description">The circular Visum tracking symbol with four outer points and a central point.</desc>

  <!-- Transparent vector master. -->
  <g id="visum-mark" transform="translate(72 72)">
    <circle cx="138" cy="138" r="116"
            fill="none"
            stroke="#C9C0B4"
            stroke-width="2"
            vector-effect="non-scaling-stroke"/>

    <g fill="#F5F5F4">
      <circle cx="138" cy="22" r="9"/>
      <circle cx="254" cy="138" r="9"/>
      <circle cx="138" cy="254" r="9"/>
      <circle cx="22" cy="138" r="9"/>
      <circle cx="138" cy="138" r="6"/>
    </g>
  </g>
</svg>
